plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'

    testImplementation 'junit:junit:4.13.2'
}
