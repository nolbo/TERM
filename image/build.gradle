plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

// Generated only by the image producer, then included in the APK's signature.
// Reviewed default pins survive ordinary debug/release builds. An explicit factory
// catalog overrides them only for that build; absent pins keep the public build empty.
def avfCatalog = providers.gradleProperty('avfImageCatalog')
def defaultCatalog = file('catalog-approved.properties')
def hasApprovedCatalog = avfCatalog.isPresent() || defaultCatalog.isFile()
tasks.named('processResources') {
    // Always overwrite the resource, including product -> public incremental builds.
    def catalogFile = avfCatalog.isPresent() ? rootProject.file(avfCatalog.get()) : (hasApprovedCatalog ? defaultCatalog : file('catalog-empty.properties'))
    inputs.property('approvedCatalogPresent', hasApprovedCatalog)
    from(catalogFile) {
        into 'dev/terminal/image'
        rename { 'approved-debian.properties' }
    }
    if (hasApprovedCatalog) {
        inputs.file(catalogFile)
        doFirst {
            if (!catalogFile.isFile()) throw new GradleException('AVF image catalog file is missing')
            def approved = new Properties()
            catalogFile.withInputStream { approved.load(it) }
            def distributions = ['debian', 'ubuntu', 'archlinux']
            def entries = [approved]
            if (!approved.containsKey('id')) {
                def selected = approved.getProperty('distributions', '').split(',').toList()
                if (approved.getProperty('formatVersion') != '2' || !selected ||
                        selected.toSet().size() != selected.size() || !distributions.containsAll(selected)) {
                    throw new GradleException('Invalid approved AVF distribution catalog')
                }
                entries = selected.collect { distribution ->
                    def entry = new Properties()
                    approved.each { key, value ->
                        if (key.startsWith(distribution + '.')) entry.setProperty(key.substring(distribution.length() + 1), value)
                    }
                    if (entry.getProperty('id') != distribution + '-arm64-current') throw new GradleException('AVF catalog distribution mismatch')
                    entry
                }
            }
            entries.each { entry ->
            def uri = new URI(entry.getProperty('manifestUri', ''))
            def limit = entry.getProperty('maxArtifactBytes', '0').toLong()
            if (!(entry.getProperty('id') in distributions.collect { it + '-arm64-current' }) || uri.scheme != 'https' ||
                    !uri.host || uri.userInfo || uri.query || uri.fragment || !uri.path.endsWith('/manifest.properties') ||
                    !(entry.getProperty('manifestSha256', '') ==~ /[0-9a-f]{64}/) ||
                    limit < 1 || limit > 32L * 1024 * 1024 * 1024 ||
                    !(entry.getProperty('compression', 'none') in ['none', 'gzip'])) {
                throw new GradleException('Invalid approved AVF image catalog')
            }
            }
        }
    }
}
