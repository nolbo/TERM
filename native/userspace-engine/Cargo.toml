[workspace]
resolver = "2"
members = ["crates/ue-abi", "crates/ue-core", "crates/ue-platform", "crates/ue-runtime"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1

[profile.dev]
panic = "abort"
