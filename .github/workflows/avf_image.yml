name: Build approved AVF Linux image

on:
  push:
    branches: [dev]
    paths:
      - 'guest/**'
      - 'image/**'
      - '!image/catalog-approved.properties'
      - 'tests/image/**'
      - 'tools/avf/**'
      - '.github/workflows/avf_image.yml'
  workflow_dispatch:
    inputs:
      distribution:
        description: Guest distribution
        type: choice
        options: [debian, ubuntu, archlinux]
        default: debian
      release_id:
        description: Immutable image release ID
        required: true
      publish:
        description: Publish verified assets to public TERM (requires committed Korean patch notes)
        type: boolean
        default: false
      notify:
        description: Send an image publication notification to Discord
        type: boolean
        default: false
      source_sha256:
        description: Optional reviewed SHA-256 of Google's upstream archive
        required: false
      reuse_candidate:
        description: Reuse the exact verified assets in this release ID's unpublished draft
        type: boolean
        default: false
      candidate_commit:
        description: Required original 40-character producer commit when reusing a verified draft
        required: false
      kernel_run_id:
        description: Optional successful AVF workflow run with an identical kernel recipe
        required: false

permissions:
  contents: read
  actions: read

env:
  AVF_DISTRIBUTION: ${{ inputs.distribution || 'debian' }}
  TERMINAL_VERSION_CODE_OFFSET: ${{ vars.TERMINAL_VERSION_CODE_OFFSET || '0' }}

jobs:
  kernel:
    if: github.ref == 'refs/heads/dev' && !inputs.reuse_candidate && !inputs.kernel_run_id
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Sync official Android kernel sources and pinned common commit
        run: |
          sudo apt-get update
          sudo apt-get install -y repo
          mkdir -p image/build/kernel-checkout
          cd image/build/kernel-checkout
          avf_manifest=$(python3 -c 'import json; print(json.load(open("../../kernel/source.json"))["manifestRevision"])')
          avf_common=$(python3 -c 'import json; print(json.load(open("../../kernel/source.json"))["commonRevision"])')
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b "$avf_manifest"
          repo sync -c --no-tags --no-clone-bundle --fail-fast -j4
          git -C common fetch --depth=1 https://android.googlesource.com/kernel/common "$avf_common"
          git -C common switch --detach "$avf_common"
      - name: Build and verify the Image, final config and matching module ramdisk
        run: |
          python3 image/scripts/build-avf-kernel.py --checkout image/build/kernel-checkout \
            --output image/build/kernel-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: avf-container-kernel-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          path: image/build/kernel-bundle/

  image:
    needs: [kernel]
    if: >-
      always() && github.ref == 'refs/heads/dev' &&
      (needs.kernel.result == 'success' || ((inputs.reuse_candidate || inputs.kernel_run_id) && needs.kernel.result == 'skipped'))
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    timeout-minutes: 90
    outputs:
      release_id: ${{ steps.metadata.outputs.release_id }}
      manifest_sha256: ${{ steps.metadata.outputs.manifest_sha256 }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.reuse_candidate && !inputs.kernel_run_id }}
        with:
          name: avf-container-kernel-${{ github.sha }}
          path: image/build/kernel-bundle
      - name: Check the successful kernel producer and unchanged recipe
        id: kernel-source
        if: ${{ !inputs.reuse_candidate && inputs.kernel_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          AVF_KERNEL_RUN_ID: ${{ inputs.kernel_run_id }}
        run: python3 image/scripts/reuse-avf-kernel.py "$AVF_KERNEL_RUN_ID"
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.reuse_candidate && inputs.kernel_run_id }}
        with:
          name: ${{ steps.kernel-source.outputs.artifact }}
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ github.token }}
          path: image/build/kernel-bundle
      - name: Validate release inputs and shared dev history
        env:
          AVF_RELEASE_ID: ${{ inputs.release_id }}
          AVF_PUBLISH: ${{ inputs.publish }}
          AVF_REUSE: ${{ inputs.reuse_candidate }}
          AVF_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          avf_release_id=${AVF_RELEASE_ID:-avf-$AVF_DISTRIBUTION-$GITHUB_SHA}
          python3 - "$avf_release_id" <<'PY'
          import runpy, sys
          runpy.run_path('image/scripts/verify-avf-release.py')['release_id'](sys.argv[1])
          PY
          echo "AVF_RELEASE_ID=$avf_release_id" >> "$GITHUB_ENV"
          git fetch --no-tags origin dev
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev
          avf_source_commit=$GITHUB_SHA
          if [ "$AVF_REUSE" = true ]; then
            test "$AVF_PUBLISH" = true
            [[ "$AVF_CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$AVF_CANDIDATE_COMMIT" "$GITHUB_SHA"
            avf_source_commit=$AVF_CANDIDATE_COMMIT
          fi
          echo "AVF_IMAGE_SOURCE_COMMIT=$avf_source_commit" >> "$GITHUB_ENV"
          if [ "$AVF_PUBLISH" = true ]; then
            test "$GITHUB_REPOSITORY" = nolbo/TERM
            test -s "docs/release-notes/$avf_release_id.md"
            test -n "$GH_TOKEN"
            test "$(gh api repos/nolbo/TERM --jq '.private')" = false
            # An authorized publisher pins the immutable image tag first. A
            # workflow token cannot authorize new workflow-containing refs.
            gh api "repos/nolbo/TERM/git/ref/tags/$avf_release_id" >/dev/null
            test "$(gh api "repos/nolbo/TERM/commits/$avf_release_id" --jq '.sha')" = "$avf_source_commit"
          fi
      - name: Build image, guest services, disks and pinned catalog
        if: ${{ !inputs.reuse_candidate }}
        env:
          AVF_SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          sudo modprobe vhost_vsock
          python3 -m unittest discover -s tests/image -p 'test_*.py'
          avf_arguments=(--kernel-bundle image/build/kernel-bundle)
          if [ -n "$AVF_SOURCE_SHA256" ]; then
            avf_arguments+=(--source-sha256 "$AVF_SOURCE_SHA256")
          fi
          # Source and anonymous runtime downloads share the public TERM repository.
          python3 image/scripts/build-avf-image.py \
            --distribution "$AVF_DISTRIBUTION" \
            --release-id "$AVF_RELEASE_ID" \
            --base-uri "https://github.com/nolbo/TERM/releases/download/$AVF_RELEASE_ID/" \
            --output image/build/approved "${avf_arguments[@]}"
          python3 image/scripts/verify-avf-release.py --directory image/build/approved \
            --expected-commit "$GITHUB_SHA" --require-container-kernel
      - name: Reuse the verified bytes of an unpublished candidate
        if: inputs.reuse_candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$AVF_RELEASE_ID" --repo nolbo/TERM --json isDraft --jq '.isDraft')" = true
          gh release download "$AVF_RELEASE_ID" --repo nolbo/TERM --dir image/build/approved \
            --pattern '*.gz' --pattern '*.properties' --pattern provenance.json --pattern SHA256SUMS
          python3 image/scripts/verify-avf-release.py --directory image/build/approved \
            --expected-commit "$AVF_IMAGE_SOURCE_COMMIT" --require-normal-boot --require-container-kernel
      - name: Record verified metadata
        id: metadata
        run: |
          python3 - <<'PY'
          import os, pathlib, runpy
          verify = runpy.run_path('image/scripts/verify-avf-release.py')
          approved = verify['verify_directory'](pathlib.Path('image/build/approved'), metadata_only=True,
                                               expected_commit=os.environ['AVF_IMAGE_SOURCE_COMMIT'], require_normal_boot=True,
                                               require_container_kernel=True)
          if approved['releaseId'] != os.environ['AVF_RELEASE_ID'] or approved['id'] != os.environ['AVF_DISTRIBUTION'] + '-arm64-current':
              raise ValueError('Candidate release/distribution differs from the dispatch')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"release_id={approved['releaseId']}\nmanifest_sha256={approved['manifestSha256']}\n")
              output.write(f"source_commit={os.environ['AVF_IMAGE_SOURCE_COMMIT']}\n")
          PY
      - name: Stage verified image assets in an unpublished release
        if: github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.reuse_candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Draft assets carry the verified bytes between jobs without depending
          # on Actions artifact storage. Duplicate release IDs fail closed.
          gh release create "$AVF_RELEASE_ID" --repo nolbo/TERM --draft --prerelease --latest=false --verify-tag \
            --title "AVF Linux $AVF_RELEASE_ID" --notes-file "docs/release-notes/$AVF_RELEASE_ID.md" \
            image/build/approved/*.gz image/build/approved/*.properties \
            image/build/approved/provenance.json image/build/approved/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
        with:
          name: avf-${{ env.AVF_DISTRIBUTION }}-${{ steps.metadata.outputs.release_id }}
          compression-level: 0
          if-no-files-found: error
          path: |
            image/build/approved/*.gz
            image/build/approved/*.properties
            image/build/approved/provenance.json
            image/build/approved/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
        with:
          name: avf-catalog-${{ steps.metadata.outputs.release_id }}
          if-no-files-found: error
          path: |
            image/build/approved/catalog.properties
            image/build/approved/manifest.properties
            image/build/approved/provenance.json
            image/build/approved/SHA256SUMS

  apk:
    needs: image
    # Reusing a verified candidate intentionally skips the ancestor kernel job.
    # Override implicit success() while still requiring the image gate to pass.
    if: >-
      !cancelled() && needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # GitHub requires write access to read unpublished release drafts.
      contents: write
    env:
      TERMINAL_UPDATE_CHANNEL: dev
      TERMINAL_UPDATE_REVISION: ${{ github.sha }}
      AVF_IMAGE_SOURCE_COMMIT: ${{ needs.image.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
        with:
          name: avf-catalog-${{ needs.image.outputs.release_id }}
          path: image/build/approved
      - name: Download factory metadata from the unpublished release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          AVF_RELEASE_ID: ${{ needs.image.outputs.release_id }}
        run: |
          test "$(gh release view "$AVF_RELEASE_ID" --repo nolbo/TERM --json isDraft --jq '.isDraft')" = true
          gh release download "$AVF_RELEASE_ID" --repo nolbo/TERM --dir image/build/approved \
            --pattern catalog.properties --pattern manifest.properties \
            --pattern provenance.json --pattern SHA256SUMS
      - name: Validate factory metadata from this source commit
        env:
          AVF_MANIFEST_SHA256: ${{ needs.image.outputs.manifest_sha256 }}
        run: |
          python3 image/scripts/verify-avf-release.py --directory image/build/approved --metadata-only \
            --expected-commit "$AVF_IMAGE_SOURCE_COMMIT" --expected-manifest-sha "$AVF_MANIFEST_SHA256" \
            --require-container-kernel
          python3 image/scripts/merge-avf-catalog.py --existing image/catalog-approved.properties \
            --candidate image/build/approved/catalog.properties --output image/build/approved/catalog-merged.properties
          echo "ORG_GRADLE_PROJECT_avfImageCatalog=$GITHUB_WORKSPACE/image/build/approved/catalog-merged.properties" >> "$GITHUB_ENV"
      - name: Reuse the canonical Android workflow version-code sequence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This is a review APK, not a new channel release. Do not create a second sequence.
          terminal_android_sequence=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?per_page=5" --jq '[.workflow_runs[].run_number] | max // 0')
          [[ "$terminal_android_sequence" =~ ^[0-9]+$ ]]
          terminal_version_code=$(python3 tools/updates/version-code.py --run-number "$terminal_android_sequence")
          echo "TERMINAL_UPDATE_VERSION_CODE=$terminal_version_code" >> "$GITHUB_ENV"
      - name: Use Maven AAPT2 on the CI host
        run: |
          sed -i '/^android.aapt2FromMavenOverride=/d' gradle.properties
          echo "TERMINAL_NDK_VERSION=$(sed -n 's/^ndkVersion=//p' gradle.properties)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ (github.event_name != 'push' && github.event_name != 'workflow_dispatch') || github.ref != 'refs/heads/dev' }}
      - name: Restore pinned Native CLI build
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: android-runtime/build/native-cli
          key: ${{ runner.os }}-${{ runner.arch }}-native-cli-v1-rust-1.89.0-ndk-${{ env.TERMINAL_NDK_VERSION }}-${{ hashFiles('tools/native-cli/**', 'tools/iphone/android-clang.sh') }}
      - name: Restore Rust dependencies and compilation cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android-runtime/build/iphone-tools/target
            android-runtime/build/device-safety-connector/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.89.0-ndk-${{ env.TERMINAL_NDK_VERSION }}-${{ hashFiles('tools/iphone/connector/**', 'tools/iphone/android-clang.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.89.0-ndk-${{ env.TERMINAL_NDK_VERSION }}-
      - name: Install pinned Android Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --target aarch64-linux-android
      - name: Prepare verified Rootless runtime
        run: |
          python3 tools/rootless/prepare-release-runtime.py --output "$GITHUB_WORKSPACE/android-runtime/build/verifiedRootless"
          echo "ORG_GRADLE_PROJECT_rootlessAcceleratedPayload=$GITHUB_WORKSPACE/android-runtime/build/verifiedRootless" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_rootlessStdioBuffer=true" >> "$GITHUB_ENV"
          echo "TERMINAL_REQUIRE_ROOTLESS_ACCELERATION=true" >> "$GITHUB_ENV"
      - name: Build and verify the catalog-bearing debug APK
        env:
          AVF_MANIFEST_SHA256: ${{ needs.image.outputs.manifest_sha256 }}
        run: |
          ./gradlew :android-app:assembleDebug :android-runtime:testDebugUnitTest :image:test \
            :terminal-emulator:testDebugUnitTest :terminal-view:testDebugUnitTest --build-cache --console=plain
          python3 tools/avf/verify-driver-apk.py android-app/build/outputs/apk/debug/android-app-debug.apk
          python3 tools/rootless/prepare-release-runtime.py --verify-apk android-app/build/outputs/apk/debug/android-app-debug.apk
          python3 image/scripts/verify-avf-release.py --directory image/build/approved --metadata-only \
            --expected-commit "$AVF_IMAGE_SOURCE_COMMIT" --expected-manifest-sha "$AVF_MANIFEST_SHA256" \
            --apk android-app/build/outputs/apk/debug/android-app-debug.apk \
            --apk-catalog image/build/approved/catalog-merged.properties --require-container-kernel
      - name: Save verified Native CLI build
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android-runtime/build/native-cli
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Save trusted Rust compilation cache
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/dev' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android-runtime/build/iphone-tools/target
            android-runtime/build/device-safety-connector/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: avf-debug-${{ needs.image.outputs.release_id }}
          compression-level: 0
          if-no-files-found: error
          path: android-app/build/outputs/apk/debug/android-app-debug.apk

  publish:
    needs: [image, apk]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish &&
      needs.image.result == 'success' && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: avf-public-image-release
      cancel-in-progress: false
    env:
      AVF_IMAGE_SOURCE_COMMIT: ${{ needs.image.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download the verified factory assets from the unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
          AVF_RELEASE_ID: ${{ needs.image.outputs.release_id }}
        run: |
          test "$(gh release view "$AVF_RELEASE_ID" --repo nolbo/TERM --json isDraft --jq '.isDraft')" = true
          gh release download "$AVF_RELEASE_ID" --repo nolbo/TERM --dir image/build/approved \
            --pattern '*.gz' --pattern '*.properties' --pattern provenance.json --pattern SHA256SUMS
      - name: Verify and publish immutable image assets to public TERM
        env:
          GH_TOKEN: ${{ github.token }}
          AVF_RELEASE_ID: ${{ needs.image.outputs.release_id }}
          AVF_MANIFEST_SHA256: ${{ needs.image.outputs.manifest_sha256 }}
        run: |
          set +x
          test -n "$GH_TOKEN"
          git fetch --no-tags origin dev
          git merge-base --is-ancestor "$GITHUB_SHA" origin/dev
          git merge-base --is-ancestor "$AVF_IMAGE_SOURCE_COMMIT" "$GITHUB_SHA"
          test -s "docs/release-notes/$AVF_RELEASE_ID.md"
          test "$(gh api repos/nolbo/TERM --jq '.private')" = false
          python3 image/scripts/verify-avf-release.py --directory image/build/approved \
            --expected-commit "$AVF_IMAGE_SOURCE_COMMIT" --expected-manifest-sha "$AVF_MANIFEST_SHA256" \
            --require-container-kernel
          # Both factory and catalog-bearing APK gates have passed. Publish the
          # existing draft without replacing any verified image bytes.
          test "$(gh release view "$AVF_RELEASE_ID" --repo nolbo/TERM --json isDraft --jq '.isDraft')" = true
          gh release edit "$AVF_RELEASE_ID" --repo nolbo/TERM --draft=false --prerelease --latest=false \
            --notes-file "docs/release-notes/$AVF_RELEASE_ID.md"
          python3 image/scripts/verify-avf-release.py --directory image/build/approved --metadata-only \
            --expected-commit "$AVF_IMAGE_SOURCE_COMMIT" --expected-manifest-sha "$AVF_MANIFEST_SHA256" \
            --approve image/catalog-approved.properties --require-container-kernel
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: avf-approved-default-${{ needs.image.outputs.release_id }}
          if-no-files-found: error
          path: image/catalog-approved.properties

  notify-release:
    needs: [image, publish]
    if: github.repository == 'nolbo/TERM' && github.event_name == 'workflow_dispatch' && inputs.publish && inputs.notify
    permissions:
      contents: read
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.image.outputs.release_id }}
    secrets:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
