name: Android verification

on:
  push:
  pull_request:

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is derived from origin/main's complete history.
          fetch-depth: 0
      - name: Fetch mainline update revision
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --target aarch64-linux-android
      - name: Build and test
        run: ./gradlew :android-app:assembleDebug :android-runtime:testDebugUnitTest :image:test --console=plain
      - name: USB host safety regression gate (not physical validation)
        run: |
          terminal_ndk_version=$(sed -n 's/^ndkVersion=//p' gradle.properties)
          python3 tests/usb/safety_gate.py --scope host --ndk "$ANDROID_HOME/ndk/$terminal_ndk_version" > "${{ runner.temp }}/usb-safety-report.json"
      - name: Publish safety scope report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usb-safety-report
          path: ${{ runner.temp }}/usb-safety-report.json
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: droid-terminal-debug
          path: |
            android-app/build/outputs/apk/debug/android-app-debug.apk
            android-runtime/build/distributions/iphone-worker-source.tar.gz
            android-runtime/build/iphone-tools/distributions/iphone-tools-source.tar.gz
            android-runtime/build/sidestore-native/distributions/sidestore-bootstrap-source.tar.gz
