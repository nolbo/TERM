name: Android verification

on:
  push:
  pull_request:

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test
        run: ./gradlew :android-app:assembleDebug :android-runtime:testDebugUnitTest :image:test --console=plain
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: droid-terminal-debug
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
