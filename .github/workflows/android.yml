name: Android verification

on:
  push:
  pull_request:
  # Manual runs verify by default; explicit publication uses shared dev history.
  workflow_dispatch:
    inputs:
      publish_channel:
        description: 'Publish the selected channel from dev; none only verifies signing'
        type: choice
        required: true
        default: none
        options:
          - none
          - main
          - dev
      notify:
        description: 'Announce the published app release to Discord (enabled by default)'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

env:
  TERMINAL_VERSION_CODE_OFFSET: ${{ vars.TERMINAL_VERSION_CODE_OFFSET || '0' }}

jobs:
  build-and-unit-test:
    if: ${{ !startsWith(github.ref, 'refs/tags/v0.1.0-rootless.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
    # Publish directly from the verified build directory without an Actions
    # artifact handoff. Serialize channel builds through publication.
    concurrency:
      group: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && (inputs.publish_channel == 'main' || inputs.publish_channel == 'dev'))) && 'term-public-release' || format('term-verification-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the event commit with full history for publication validation.
          fetch-depth: 0
      - name: Select update revision and version
        id: release
        env:
          TERMINAL_PUBLISH_CHANNEL: ${{ inputs.publish_channel || 'none' }}
        run: |
          echo "TERMINAL_NDK_VERSION=$(sed -n 's/^ndkVersion=//p' gradle.properties)" >> "$GITHUB_ENV"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/dev:refs/remotes/origin/dev
          python3 tools/updates/select-channel.py
      - name: Check channel publication inputs before building
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        env:
          TERMINAL_SIGNING_KEYSTORE_BASE64: ${{ secrets.TERMINAL_SIGNING_KEYSTORE_BASE64 }}
          TERMINAL_SIGNING_STORE_PASSWORD: ${{ secrets.TERMINAL_SIGNING_STORE_PASSWORD }}
        run: |
          set +x
          test "$GITHUB_REPOSITORY" = nolbo/TERM
          if [ -z "$TERMINAL_SIGNING_KEYSTORE_BASE64" ] || [ -z "$TERMINAL_SIGNING_STORE_PASSWORD" ]; then
            echo 'Configure the existing signing secrets before building a channel update.'
            exit 1
          fi
          test -s "docs/release-notes/${TERMINAL_UPDATE_CHANNEL}-latest.md"
      - name: Use Maven AAPT2 on the CI host
        # The checked-in override is for the local ARM64/QEMU host only.
        run: sed -i '/^android.aapt2FromMavenOverride=/d' gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Gradle dependencies and build cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # PRs can restore trusted caches but only channel pushes save them.
          cache-read-only: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev') }}
      - name: Restore Rust dependencies and compilation cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android-runtime/build/iphone-tools/target
            android-runtime/build/device-safety-connector/target
            android-runtime/build/device-safety-rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.89.0-ndk-${{ env.TERMINAL_NDK_VERSION }}-${{ hashFiles('tools/iphone/connector/**', 'tools/iphone/android-clang.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.89.0-ndk-${{ env.TERMINAL_NDK_VERSION }}-
      - name: Install pinned Android Rust toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --target aarch64-linux-android
      - name: Prepare verified accelerated Rootless runtime
        run: |
          python3 tools/rootless/prepare-release-runtime.py --output "$GITHUB_WORKSPACE/android-runtime/build/verifiedRootless"
          echo "ORG_GRADLE_PROJECT_rootlessAcceleratedPayload=$GITHUB_WORKSPACE/android-runtime/build/verifiedRootless" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_rootlessStdioBuffer=true" >> "$GITHUB_ENV"
          echo "TERMINAL_REQUIRE_ROOTLESS_ACCELERATION=true" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          ./gradlew :android-app:assembleDebug :android-app:testDebugUnitTest :android-runtime:testDebugUnitTest :image:test --build-cache --console=plain
          python3 tools/rootless/prepare-release-runtime.py --verify-apk android-app/build/outputs/apk/debug/android-app-debug.apk
          python3 tools/avf/verify-driver-apk.py android-app/build/outputs/apk/debug/android-app-debug.apk
          python3 tools/native-cli/verify.py --apk android-app/build/outputs/apk/debug/android-app-debug.apk
          python3 -m unittest discover -s tests/image -p 'test_*.py'
          python3 -m unittest discover -s tests/updates -p 'test_*.py'
      - name: USB host safety regression gate (not physical validation)
        run: |
          terminal_ndk_version=$(sed -n 's/^ndkVersion=//p' gradle.properties)
          python3 tests/usb/safety_gate.py --scope host --ndk "$ANDROID_HOME/ndk/$terminal_ndk_version" > "${{ runner.temp }}/usb-safety-report.json"
      - name: Publish safety scope report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: usb-safety-report
          path: ${{ runner.temp }}/usb-safety-report.json
      - name: Publish debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: droid-terminal-debug
          # APKs and source tarballs are already compressed.
          compression-level: 0
          path: |
            android-app/build/outputs/apk/debug/android-app-debug.apk
            android-runtime/build/distributions/iphone-worker-source.tar.gz
            android-runtime/build/iphone-tools/distributions/iphone-tools-source.tar.gz
      - name: Use JDK 21 for release lint
        # AGP 9.3's lint parser calls List.removeLast(), unavailable on JDK 17.
        # Verification above and explicit compilation toolchains remain on 17.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build signed channel update
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        env:
          TERMINAL_SIGNING_KEYSTORE_BASE64: ${{ secrets.TERMINAL_SIGNING_KEYSTORE_BASE64 }}
          TERMINAL_SIGNING_STORE_PASSWORD: ${{ secrets.TERMINAL_SIGNING_STORE_PASSWORD }}
        run: |
          set +x
          umask 077
          if [ -z "$TERMINAL_SIGNING_KEYSTORE_BASE64" ] || [ -z "$TERMINAL_SIGNING_STORE_PASSWORD" ]; then
            echo "Configure TERMINAL_SIGNING_KEYSTORE_BASE64 and TERMINAL_SIGNING_STORE_PASSWORD repository secrets."
            exit 1
          fi
          export TERMINAL_SIGNING_STORE_FILE="$RUNNER_TEMP/terminal-release.p12"
          trap 'rm -f "$TERMINAL_SIGNING_STORE_FILE"' EXIT
          printf '%s' "$TERMINAL_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$TERMINAL_SIGNING_STORE_FILE"
          unset TERMINAL_SIGNING_KEYSTORE_BASE64
          bash tools/build-release.sh --build-cache
          python3 tools/rootless/prepare-release-runtime.py --verify-apk android-app/build/outputs/apk/release/android-app-release.apk
          python3 tools/updates/verify-release-apk.py \
            --apk android-app/build/outputs/apk/release/android-app-release.apk \
            --catalog image/catalog-approved.properties \
            --certificate-sha256 7f639e70cc1969415beab27cfb10db6d10bf553b1f956a2f9d68d55ebf3785ba
          python3 tools/native-cli/verify.py --apk android-app/build/outputs/apk/release/android-app-release.apk
          mkdir -p android-app/build/update
          python3 tools/native-cli/package-source.py android-runtime/build/native-cli android-app/build/update/native-cli-source.tar.gz
          python3 tools/updates/create-manifest.py \
            --apk android-app/build/outputs/apk/release/android-app-release.apk \
            --metadata android-app/build/outputs/apk/release/output-metadata.json \
            --commit "$GITHUB_SHA" --channel "$TERMINAL_UPDATE_CHANNEL" --output android-app/build/update/update.json
          cp android-app/build/outputs/apk/release/android-app-release.apk android-app/build/update/TERM.apk
          cp android-runtime/build/verifiedRootless/rootless-runtime-source.tar.gz android-runtime/build/verifiedRootless/rootless-runtime.json android-app/build/update/
          cp "docs/release-notes/${TERMINAL_UPDATE_CHANNEL}-latest.md" android-app/build/update/RELEASE_NOTES.ko.md
          cp android-runtime/build/distributions/iphone-worker-source.tar.gz \
            android-runtime/build/iphone-tools/distributions/iphone-tools-source.tar.gz android-app/build/update/
      - name: Publish signed update APK
        if: steps.release.outputs.publish == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: terminal-${{ steps.release.outputs.channel }}-update
          if-no-files-found: error
          compression-level: 0
          path: android-app/build/update/
      - name: Save trusted Rust compilation cache
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android-runtime/build/iphone-tools/target
            android-runtime/build/device-safety-connector/target
            android-runtime/build/device-safety-rust/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Publish verified update to TERM
        id: publish
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/updates/publish.sh android-app/build/update
          echo "release_tag=${TERMINAL_UPDATE_CHANNEL}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  sign-rootless-prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.1.0-rootless.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign verified local candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL_SIGNING_KEYSTORE_BASE64: ${{ secrets.TERMINAL_SIGNING_KEYSTORE_BASE64 }}
          TERMINAL_SIGNING_STORE_PASSWORD: ${{ secrets.TERMINAL_SIGNING_STORE_PASSWORD }}
        run: bash tools/updates/sign-rootless-prerelease.sh

  notify-release:
    needs: build-and-unit-test
    if: github.repository == 'nolbo/TERM' && needs.build-and-unit-test.outputs.release_tag != '' && (github.event_name != 'workflow_dispatch' || inputs.notify)
    permissions:
      contents: read
    uses: ./.github/workflows/discord-release.yml
    with:
      release_tag: ${{ needs.build-and-unit-test.outputs.release_tag }}
    secrets:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
