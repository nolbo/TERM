[package]
name = "sidestore-bootstrap"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[patch.crates-io]
idevice = { path = "../idevice" }

[dependencies]
terminal-iphone-connector = { path = "../connector" }
isideload = { path = "../upstream/isideload/isideload", default-features = false, features = ["install", "tokio-mt"] }
idevice = { version = "=0.1.65", default-features = false, features = ["ring", "usbmuxd", "pair", "afc", "installation_proxy", "house_arrest", "core_device_proxy", "tunnel_tcp_stack", "remote_pairing", "rsd"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
plist = "=1.10.0"
libc = "=0.2.189"
rootcause = "=0.12.1"
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "stream"] }
sha2 = "=0.10.9"
uuid = { version = "=1.24.0", features = ["v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
zeroize = "=1.9.0"
async-trait = "=0.1.91"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
