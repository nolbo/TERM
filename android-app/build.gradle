import com.android.build.api.artifact.ScopedArtifact
import com.android.build.api.artifact.SingleArtifact
import com.android.build.api.variant.ScopedArtifacts
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import javax.inject.Inject

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

abstract class DeduplicateLicenseAssets extends DefaultTask {
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getInputAssets()

    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ListProperty<RegularFile> getJavaResourceJars()

    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ListProperty<Directory> getJavaResourceDirectories()

    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getDependencyArchives()

    @Input
    abstract SetProperty<String> getOriginalJavaResourceExcludes()

    @InputFile @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getGenerator()

    @OutputDirectory
    abstract DirectoryProperty getOutputAssets()

    @Inject abstract FileSystemOperations getFileSystemOperations()
    @Inject abstract ExecOperations getExecOperations()

    @TaskAction
    void generate() {
        // Sync removes stale generated blobs on incremental builds, while all
        // original assets (including dependency assets) remain untouched.
        fileSystemOperations.sync {
            from inputAssets
            into outputAssets
            exclude 'licenses/**'
            includeEmptyDirs = false
        }
        def arguments = ['python3', generator.get().asFile.absolutePath,
                         '--input-assets', inputAssets.get().asFile.absolutePath,
                         '--output-assets', outputAssets.get().asFile.absolutePath]
        javaResourceJars.get().each { arguments.addAll(['--java-resource-jar', it.asFile.absolutePath]) }
        javaResourceDirectories.get().each { arguments.addAll(['--java-resource-directory', it.asFile.absolutePath]) }
        dependencyArchives.files.sort().each { arguments.addAll(['--java-resource-jar', it.absolutePath]) }
        originalJavaResourceExcludes.get().sort().each { arguments.addAll(['--java-resource-exclude', it]) }
        execOperations.exec { commandLine arguments }
    }
}

/**
 * main and dev are separate update channels. CI pins the selected remote ref
 * to the event commit and supplies a shared workflow sequence versionCode.
 */
def gitOutput = { List<String> arguments ->
    providers.exec {
        workingDir rootProject.projectDir
        commandLine(['git'] + arguments)
    }.standardOutput.asText.get().trim()
}

def updateChannel = providers.environmentVariable('TERMINAL_UPDATE_CHANNEL')
    .orElse(gitOutput(['branch', '--show-current']) == 'dev' ? 'dev' : 'main').get()
if (!(updateChannel in ['main', 'dev'])) throw new GradleException('Update channel must be main or dev.')
def updateRevision = providers.environmentVariable('TERMINAL_UPDATE_REVISION')
    .orElse(gitOutput(['rev-parse', '--verify', 'HEAD'])).get()
if (!(updateRevision ==~ /[0-9a-f]{40}/)) throw new GradleException('Update revision must be a full commit SHA.')
if (gitOutput(['rev-parse', '--is-shallow-repository']) != 'false') {
    throw new GradleException('Full Git history is required for update versions. Run git fetch --unshallow before building.')
}
def revisionCount = gitOutput(['rev-list', '--count', "origin/${updateChannel}"]).toInteger()
def updateCodeText = providers.environmentVariable('TERMINAL_UPDATE_VERSION_CODE').orElse(revisionCount.toString()).get()
if (!updateCodeText.matches('[0-9]+') || updateCodeText.toBigInteger() < 1 || updateCodeText.toBigInteger() > Integer.MAX_VALUE) {
    throw new GradleException('Update versionCode must be a positive Android integer.')
}
def updateVersionCode = updateCodeText.toInteger()
def appBaseVersion = project.properties.appBaseVersion
def appVersionName = "${appBaseVersion}+${updateChannel}.${updateVersionCode}.${updateRevision.take(12)}"

// Keep private signing material outside the worktree. PKCS12 uses the store
// password for its key unless a separate key password is explicitly supplied.
def releaseStoreFile = providers.environmentVariable('TERMINAL_SIGNING_STORE_FILE')
    .orElse(new File(System.getProperty('user.home'), '.local/share/terminal-signing/terminal-release.p12').path).get()
def releaseStorePassword = providers.environmentVariable('TERMINAL_SIGNING_STORE_PASSWORD').orNull
def releaseKeyPassword = providers.environmentVariable('TERMINAL_SIGNING_KEY_PASSWORD').orElse(
    providers.environmentVariable('TERMINAL_SIGNING_STORE_PASSWORD')).orNull
def releaseKeyAlias = providers.environmentVariable('TERMINAL_SIGNING_KEY_ALIAS').orElse('terminal').get()
def unsignedRelease = providers.gradleProperty('terminalUnsignedRelease').orNull == 'true'

def checkReleaseSigning = tasks.register('checkReleaseSigning') {
    doLast {
        if (!releaseStorePassword || !releaseKeyPassword) {
            throw new GradleException('Release signing requires TERMINAL_SIGNING_STORE_PASSWORD. Use bash tools/build-release.sh for an interactive build.')
        }
        if (!file(releaseStoreFile).isFile()) {
            throw new GradleException('Release keystore not found. Set TERMINAL_SIGNING_STORE_FILE to your existing keystore.')
        }
    }
}

tasks.configureEach {
    if (!unsignedRelease && (name == 'packageRelease' || name == 'validateSigningRelease')) {
        dependsOn checkReleaseSigning
    }
    if (name == 'packageDebug' || name == 'packageRelease') {
        // Incremental Zipflinger updates retain deleted entries as empty ZIP records.
        // Recreate only the APK so repeated builds cannot accumulate those holes.
        outputs.upToDateWhen { false }
    }
}

android {
    namespace 'dev.terminal.app'
    compileSdk project.properties.compileSdkVersion.toInteger()

    defaultConfig {
        applicationId 'dev.terminal.app'
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode updateVersionCode
        versionName appVersionName
        buildConfigField 'String', 'UPDATE_REVISION', "\"${updateRevision}\""
        buildConfigField 'String', 'UPDATE_CHANNEL', "\"${updateChannel}\""
        resValue 'color', 'app_icon_foreground', '#E3E4E8'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile file(releaseStoreFile)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            resValue 'color', 'app_icon_foreground', updateChannel == 'main' ? '#00FFA1' : '#FF0062'
        }
        release {
            // AGP 9.3 enables code/resource optimization and Android's default
            // keep rules together; release-specific rules live in keepRules/*.keep.
            optimization {
                enable = true
            }
            // Signed dev updates and versions with a prerelease suffix are prereleases.
            if (updateChannel == 'dev' || appBaseVersion.contains('-')) {
                resValue 'color', 'app_icon_foreground', '#FF8400'
            }
            signingConfig unsignedRelease ? null : signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        buildConfig true
        resValues true
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
        // Rootless runtime executables are APK payloads selected from nativeLibraryDir.
        // They must be extracted to an immutable executable filesystem path.
        jniLibs.useLegacyPackaging = true
        // These are verified runtime inputs, not newly linked JNI libraries.
        // Preserve exact bytes across local/CI strip-tool versions.
        jniLibs.keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so', '**/libproot-faststat.so']
    }
}

// Debug has its own application ID and install sequence. Never reuse the
// release workflow number or a remote commit count for local debug updates.
def debugVersionCode = providers.exec {
    commandLine 'python3', rootProject.file('tools/updates/debug-version-code.py'),
        '--state-file', new File(gradle.gradleUserHomeDir, 'terminal/debug-version.sqlite3'),
        '--minimum', providers.environmentVariable('TERMINAL_DEBUG_MIN_VERSION_CODE').orElse(updateCodeText).get()
}.standardOutput.asText.map { it.trim().toInteger() }

def sourceJavaResourceExcludes = [] as Set
androidComponents {
    finalizeDsl { dsl ->
        sourceJavaResourceExcludes = dsl.packaging.resources.excludes.toSet()
    }
    onVariants(selector().all()) { variant ->
        def catalog = tasks.register("deduplicate${variant.name.capitalize()}LicenseAssets", DeduplicateLicenseAssets) {
            generator.set(rootProject.layout.projectDirectory.file('tools/licenses/deduplicate.py'))
            // Scoped JAVA_RES does not include external dependency notices in
            // AGP 9.3. Read the selected runtime JARs/AARs as well, before exclusions.
            dependencyArchives.from(variant.runtimeConfiguration.incoming.artifactView {
                componentFilter { it instanceof ModuleComponentIdentifier }
            }.files)
            originalJavaResourceExcludes.set(sourceJavaResourceExcludes)
        }
        // Read Java notices before packaging exclusions. Preserve their complete
        // component paths in the same offline catalog rather than discarding them.
        variant.artifacts.forScope(ScopedArtifacts.Scope.ALL).use(catalog).toGet(
            ScopedArtifact.JAVA_RES.INSTANCE, { it.javaResourceJars }, { it.javaResourceDirectories })
        variant.packaging.resources.excludes.addAll([
            'META-INF/**/LICENSE*', 'META-INF/**/NOTICE*', 'META-INF/**/COPYING*'
        ])
        variant.artifacts.use(catalog).wiredWithDirectories(
            { it.inputAssets }, { it.outputAssets }).toTransform(SingleArtifact.ASSETS.INSTANCE)
    }
    onVariants(selector().withBuildType('debug')) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(debugVersionCode)
            output.versionName.set(debugVersionCode.map { code ->
                "${appBaseVersion}+${updateChannel}.${code}.${updateRevision.take(12)}-debug".toString()
            })
        }
    }
}

dependencies {
    implementation project(':aosp-avf-runtime')
    // OEMs may compile against the exact full implementation ABI from their target AOSP build.
    if (providers.gradleProperty('avfFrameworkJar').isPresent()) {
        def frameworkJar = rootProject.file(providers.gradleProperty('avfFrameworkJar').get())
        if (!frameworkJar.isFile()) throw new GradleException('avfFrameworkJar must name an existing AOSP framework-virtualization.jar')
        compileOnly files(frameworkJar)
    } else {
        compileOnly project(':aosp-avf-api')
    }
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation project(':android-runtime')
    implementation project(':image')
    implementation project(':terminal-view')

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha27'
    implementation 'androidx.compose.material3.adaptive:adaptive-layout:1.3.0'
    // Pure Material Color Utilities; keep the existing Compose/Expressive theme runtime.
    implementation 'com.materialkolor:material-color-utilities:4.0.1'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'io.noties.markwon:core:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
