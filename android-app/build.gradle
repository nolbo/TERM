plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.terminal.app'
    compileSdk project.properties.compileSdkVersion.toInteger()

    defaultConfig {
        applicationId 'dev.terminal.app'
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode 1
        versionName '0.1.0-spike'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
        // Rootless runtime executables are APK payloads selected from nativeLibraryDir.
        // They must be extracted to an immutable executable filesystem path.
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation project(':android-runtime')
    implementation project(':image')
    implementation project(':terminal-view')

    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // Motion only: Terminal Grid continues to own every visible component.
    implementation 'androidx.transition:transition:1.5.1'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}
